[workspace]
members = [
    "crates/causafera-types",
    "crates/causafera-core",
    "crates/causafera-world",
    "crates/causafera-geography",
    "crates/causafera-biology",
    "crates/causafera-perception",
    "crates/causafera-cognition",
    "crates/causafera-language",
    "crates/causafera-epistemics",
    "crates/causafera-isekai",
    "crates/causafera-metaphysics",
    "crates/causafera-resolution",
    "crates/causafera-domains",
    "crates/causafera-accelerate",
    "crates/causafera-accelerate-cuda",
    "crates/causafera-persistence",
    "crates/causafera-analytics",
    "crates/causafera-explanation",
    "crates/causafera-observer-api",
    "crates/causafera-observer-wire",
    "crates/causafera-runtime",
    "crates/causafera-lab",
    "crates/causafera-cli",
    "apps/observer/src-tauri",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Causafera Contributors"]
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.dependencies]
causafera-types = { path = "crates/causafera-types" }
causafera-core = { path = "crates/causafera-core" }
causafera-world = { path = "crates/causafera-world" }
causafera-geography = { path = "crates/causafera-geography" }
causafera-biology = { path = "crates/causafera-biology" }
causafera-perception = { path = "crates/causafera-perception" }
causafera-cognition = { path = "crates/causafera-cognition" }
causafera-language = { path = "crates/causafera-language" }
causafera-epistemics = { path = "crates/causafera-epistemics" }
causafera-isekai = { path = "crates/causafera-isekai" }
causafera-metaphysics = { path = "crates/causafera-metaphysics" }
causafera-resolution = { path = "crates/causafera-resolution" }
causafera-domains = { path = "crates/causafera-domains" }
causafera-accelerate = { path = "crates/causafera-accelerate" }
causafera-accelerate-cuda = { path = "crates/causafera-accelerate-cuda" }
causafera-persistence = { path = "crates/causafera-persistence" }
causafera-analytics = { path = "crates/causafera-analytics" }
causafera-explanation = { path = "crates/causafera-explanation" }
causafera-observer-api = { path = "crates/causafera-observer-api" }
causafera-observer-wire = { path = "crates/causafera-observer-wire" }
causafera-runtime = { path = "crates/causafera-runtime" }
causafera-lab = { path = "crates/causafera-lab" }

# External dependencies
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
chrono = { version = "0.4", default-features = false }
protobuf = "3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
hashbrown = "0.15"
rand = "0.8"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
