[package]
name = "causafera-observer"
version.workspace = true
description = "Causafera Observer Desktop Shell"
edition.workspace = true
license.workspace = true

[dependencies]
tauri = { version = "2", features = [] }
causafera-explanation.workspace = true
causafera-lab.workspace = true
causafera-observer-api.workspace = true
causafera-observer-wire.workspace = true
causafera-runtime.workspace = true
