syntax = "proto3";
package causafera.observer.v1;
import "causafera/observer/v1/common.proto";
import "causafera/observer/v1/spatial.proto";

enum QueryKind {
  QUERY_KIND_UNSPECIFIED = 0;
  QUERY_KIND_RUNTIME_SUMMARY = 1;
  QUERY_KIND_EXPLANATION_IR = 2;
  QUERY_KIND_WORLD_CHUNKS = 3;
  QUERY_KIND_FIELD_RASTER = 4;
}
message QueryRequest {
  uint64 request_id = 1;
  uint32 protocol_version = 2;
  QueryKind kind = 3;
  optional uint64 chunk_scope = 4;
  bytes payload = 5;
}
message QueryResponse {
  uint64 request_id = 1;
  uint32 protocol_version = 2;
  QueryStatus status = 3;
  bytes payload = 4;
}

message RuntimeSummary {
  uint64 simulation_ticks = 1;
  uint32 digest_schema_version = 2;
  bytes physical_digest = 3;
  bytes history_digest = 4;
  int64 mana_total = 5;
  int64 mana_maximum = 6;
  uint32 active_chunk_count = 7;
  int64 resolution_relevance = 8;
  uint32 resolution_level = 9;
  uint64 causal_trace_count = 10;
  uint32 actor_count = 11;
  uint64 population_total = 12;
  uint64 physical_events = 13;
  uint64 mana_cell_changes = 14;
  uint64 mana_physical_effects = 15;
  uint64 resolution_transitions = 16;
  uint64 actor_actions_committed = 17;
  uint64 actor_actions_rejected = 18;
  uint64 population_births = 19;
  uint64 population_deaths = 20;
  uint64 population_movements = 21;
  uint64 bytes_per_chunk = 22;
  uint64 latest_trace_id = 23;
  // ZigZag-encoded i128 varints for exact conserved-carrier totals.
  bytes thermal_total_cell_energy = 24;
  bytes thermal_total_reservoir_budget = 25;
  uint32 thermal_active_chunk_count = 26;
  uint32 thermal_active_cell_count = 27;
}

message WorldChunkSnapshot {
  uint64 simulation_ticks = 1;
  repeated SpatialChunkSummary chunks = 2;
  repeated MaterialSurfaceDelta material_surface_deltas = 3;
  uint32 material_surface_delta_schema_version = 4;
  repeated MaterialSurfaceGateDelta material_surface_gate_deltas = 5;
  repeated ThermalFieldDelta thermal_deltas = 6;
  uint32 thermal_delta_schema_version = 7;
}

// One bounded request for one chunk of one measured lattice. It travels in
// QueryRequest.payload, so the query envelope keeps a single shape.
enum FieldRasterKind {
  FIELD_RASTER_KIND_UNSPECIFIED = 0;
  FIELD_RASTER_KIND_TERRAIN_ELEVATION = 1;
  FIELD_RASTER_KIND_TERRAIN_ROUGHNESS = 2;
  FIELD_RASTER_KIND_MANA_INTENSITY = 3;
}

message FieldRasterRequest {
  uint64 chart_id = 1;
  sint32 chunk_x = 2;
  sint32 chunk_y = 3;
  sint32 chunk_z = 4;
  FieldRasterKind field = 5;
  // Terrain only: 0 is the carrier's 32x32 lattice, each level a block-mean
  // halving. The mana volume is projected whole at its configured extent.
  uint32 detail_level = 6;
}

message FieldRaster {
  uint64 chart_id = 1;
  sint32 chunk_x = 2;
  sint32 chunk_y = 3;
  sint32 chunk_z = 4;
  FieldRasterKind field = 5;
  uint32 detail_level = 6;
  // Samples along one lattice edge, and layers through z. A surface field has
  // depth 1; the mana volume has depth equal to its edge.
  uint32 edge = 7;
  uint32 depth = 8;
  // Packed ZigZag varints of successive differences along the scan order.
  bytes values = 9;
  bytes auxiliary = 10;
  // Packed varints, one per cell: the trace that last changed it, zero for none.
  bytes cell_traces = 11;
  uint64 generation_trace_id = 12;
}

message MaterialSurfaceDelta {
  uint64 chart_id = 1;
  sint32 chunk_x = 2;
  sint32 chunk_y = 3;
  sint32 chunk_z = 4;
  uint32 cell_ordinal = 5;
  sint64 before_condition = 6;
  sint64 after_condition = 7;
  sint64 mana_total = 8;
  optional uint64 contact_trace_id = 9;
  optional uint64 mana_effect_trace_id = 10;
  uint64 transition_tick = 11;
  optional uint64 mana_transition_trace_id = 12;
  optional sint64 mana_before = 13;
  optional sint64 mana_after = 14;
  optional sint64 local_mana_before = 15;
  optional sint64 local_mana_after = 16;
  optional uint64 local_mana_transition_trace_id = 17;
}

message MaterialSurfaceGateDelta {
  uint64 chart_id = 1;
  sint32 chunk_x = 2;
  sint32 chunk_y = 3;
  sint32 chunk_z = 4;
  uint32 cell_ordinal = 5;
  bool before_active = 6;
  bool after_active = 7;
  sint64 local_mana_before = 8;
  sint64 local_mana_after = 9;
  uint64 local_mana_transition_trace_id = 10;
  uint64 gate_transition_trace_id = 11;
  optional uint64 contact_trace_id = 12;
  uint64 transition_tick = 13;
}

message ThermalFieldDelta {
  uint64 chart_id = 1;
  sint32 chunk_x = 2;
  sint32 chunk_y = 3;
  sint32 chunk_z = 4;
  uint32 cell_ordinal = 5;
  sint64 pre_state_energy = 6;
  sint64 post_state_energy = 7;
  sint64 reservoir_scheduled_injection = 8;
  sint64 reservoir_accepted_injection = 9;
  sint64 reservoir_rejected_injection = 10;
  sint64 net_face_flux = 11;
  uint32 face_count = 12;
}
