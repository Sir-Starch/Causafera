syntax = "proto3";

package ontopolis.observer.v1;

import "ontopolis/observer/v1/common.proto";

// Streaming data from simulation to observer.
message StreamHeader {
    uint64 stream_id = 1;
    uint32 schema_version = 2;
    uint64 sequence_number = 3;
    SimulationTime simulation_time = 4;
}

message EntityChange {
    EntityId entity_id = 1;
    bytes delta = 2;
}
