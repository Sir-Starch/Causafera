syntax = "proto3";

package ontopolis.observer.v1;

import "ontopolis/observer/v1/common.proto";

// Spatial data representations.
message SpatialChunk {
    ChunkId id = 1;
    float elevation = 2;
    repeated float terrain_data = 3;
}

message SpatialQuery {
    ChunkId center = 1;
    uint32 radius = 2;
}
