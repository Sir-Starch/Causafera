syntax = "proto3";
package ontopolis.observer.v1;

message SimulationTime { uint64 ticks = 1; }
message Digest { uint32 schema_version = 1; bytes value = 2; }
message ChunkScope { optional uint64 chart_id = 1; optional uint64 chunk_id = 2; }

enum QueryStatus {
  QUERY_STATUS_UNSPECIFIED = 0;
  QUERY_STATUS_OK = 1;
  QUERY_STATUS_INVALID_REQUEST = 2;
  QUERY_STATUS_UNSUPPORTED = 3;
  QUERY_STATUS_NOT_AVAILABLE = 4;
}
