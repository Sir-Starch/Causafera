name: Bug report
description: Report a reproducible defect in the current Causafera main branch.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Causafera is experimental pre-alpha software. Do not include credentials, private data,
        undisclosed vulnerabilities, or unredacted local logs. Report security issues using SECURITY.md.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I reproduced this on the current main branch or identified the exact commit tested.
          required: true
        - label: This report contains no secrets, private data, or undisclosed security details.
          required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: Full commit SHA where the problem was reproduced.
      placeholder: 40-character Git commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Simulation runtime or scheduler
        - Domain crate
        - Persistence or replay
        - Explanation or analytics
        - Observer protocol
        - Desktop observer
        - Build, CI, or audit tooling
        - Documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Rust, Node.js, pnpm, and relevant platform details.
      placeholder: |
        OS:
        rustc --version:
        node --version:
        pnpm --version:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest commands, inputs, seed, and state needed to reproduce the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Paste short relevant output or link to a minimal repository. Redact local paths and private data.
  - type: textarea
    id: determinism
    attributes:
      label: Reproducibility and determinism
      description: State whether repeated runs, locale changes, save/resume, or input reordering change the result.
