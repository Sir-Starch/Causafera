name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Path Filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
          else
            BASE_SHA=${{ github.event.before }}
          fi
          
          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -E '\.rs$|Cargo\.toml$|Cargo\.lock$|^\.github/workflows/|^proto/|^apps/observer/src-tauri/'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.filter.outputs.rust == 'true'
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.filter.outputs.rust == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: node tools/audit/check-entry-points.mjs
        if: steps.filter.outputs.rust == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.rust == 'true'
      - run: pnpm build
        if: steps.filter.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        if: steps.filter.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.rust == 'true'
      - name: Install Tauri OS dependencies
        if: steps.filter.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --check
        if: steps.filter.outputs.rust == 'true'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: steps.filter.outputs.rust == 'true'
      - run: cargo test --workspace --all-features
        if: steps.filter.outputs.rust == 'true'
      - run: cargo test --workspace --no-default-features
        if: steps.filter.outputs.rust == 'true'

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
