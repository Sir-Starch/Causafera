name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/**'
              - 'proto/**'
              - 'apps/observer/src-tauri/**'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.filter.outputs.rust == 'true'
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.filter.outputs.rust == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: node tools/audit/check-entry-points.mjs
        if: steps.filter.outputs.rust == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.rust == 'true'
      - run: pnpm build
        if: steps.filter.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        if: steps.filter.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        if: steps.filter.outputs.rust == 'true'
      - name: Install Tauri OS dependencies
        if: steps.filter.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --check
        if: steps.filter.outputs.rust == 'true'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: steps.filter.outputs.rust == 'true'
      - run: cargo test --workspace --all-features
        if: steps.filter.outputs.rust == 'true'
      - run: cargo test --workspace --no-default-features
        if: steps.filter.outputs.rust == 'true'

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
